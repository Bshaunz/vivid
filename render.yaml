# Render Blueprint — VIVID FastAPI backend.
# Apply via: Render Dashboard → New → Blueprint → point at this repo.
# Secrets are declared with `sync: false` so Render prompts for them in the
# dashboard and they are NEVER committed (§3.2). DB migrations are run as a
# separate, pre-deploy step (see DEPLOYMENT.md) to keep deploys zero-downtime.
services:
  - type: web
    name: vivid-api
    runtime: python
    rootDir: backend
    plan: free # bump to "starter" for always-on + preDeployCommand support
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # `python -m uvicorn` (not bare `uvicorn`) starts the server through the
    # interpreter pip installed into — immune to the "uvicorn: command not found"
    # PATH error. `rootDir: backend` makes `app.main:app` the correct import path
    # (entry point is backend/app/main.py → `app = FastAPI(...)`).
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    # On a paid plan you can migrate automatically before each release instead
    # of by hand — uncomment and use the path that matches your DB (DEPLOYMENT.md):
    # preDeployCommand: alembic upgrade head
    envVars:
      - key: DEV_MODE
        value: "false" # prod: disables /docs and the localhost CORS regex
      - key: PYTHON_VERSION
        value: "3.12.7" # mature wheels for all deps; floors in requirements.txt allow it
      # ── Secrets — set in the Render dashboard, never in git ──────────────────
      - key: DATABASE_URL
        sync: false # Postgres connection string (see DEPLOYMENT.md for which role)
      - key: SUPABASE_JWT_SECRET
        sync: false # HS256 path: Supabase → Project Settings → API → JWT Secret (legacy)
      - key: SUPABASE_URL
        sync: false # ES256/RS256 path: https://<ref>.supabase.co (same as VITE_SUPABASE_URL)
        #   Set BOTH — the backend picks the scheme per-token, so it works whether
        #   the project signs with the legacy secret or the new asymmetric keys.
      - key: FRONTEND_ORIGIN
        sync: false # exact Vercel origin(s), comma-separated; no trailing slash
      - key: FRONTEND_ORIGIN_REGEX
        sync: false # optional: regex for Vercel preview URLs, e.g.
        #   https://vivid(-[a-z0-9-]+)?\.vercel\.app  — matched IN ADDITION to the list
      - key: ANTHROPIC_API_KEY
        sync: false # optional until the weekly-synthesis feature is enabled
      - key: SYNTHESIS_PROMPT_PATH
        sync: false # optional; absolute path to the private system prompt
      # ── Non-secret tunables ─────────────────────────────────────────────────
      - key: MAX_MONTHLY_TOKENS
        value: "2000000"
      - key: DAILY_TOKEN_BUDGET_PER_USER
        value: "60000"
